<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Time entries</title>
    <style>
      body { font-family: system-ui; min-width: 280px; padding: 12px; }
      form { display: flex; gap: 6px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <form id="form">
      <input name="task" placeholder="Task" required />
      <input name="minutes" type="number" min="1" value="30" required />
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <script type="module" src="popup.js"></script>
  </body>
</html>
